# 工作流名称
name: Sync to Hugging Face Hub

# 触发条件：推送到release分支或手动触发
on:
  push:
    branches:
      - release
  workflow_dispatch:

# 任务
jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      # 第一步：检出（下载）您的GitHub仓库代码
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # 第二步：使用官方推荐的Action来同步
      - name: Push to Hub
        # 这是官方的自动化机器人
        uses: huggingface/hub-action@v0
        with:
          # 您的Hugging Face Space的完整ID (用户名/Space名)
          # 请最后确认一遍这个值是否正确
          repo_id: "xiaoxiao666111/wu-fu-mi"

          # 目标仓库的类型，必须是 "space"
          repo_type: space

          # 你的Hugging Face访问令牌，它会自动从Secrets中读取
          token: ${{ secrets.HF_TOKEN }}
          
          # 强制推送，确保HF Space与GitHub完全一致
          force_push: true
