# 工作流名称
name: Sync to Hugging Face Hub

# 触发条件
on:
  push:
    branches:
      - release
  workflow_dispatch:

# 任务
jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      # 第一步：检出仓库代码
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # 第二步：使用官方推荐的具体版本号来同步
      - name: Push to Hub
        # 使用官方文档中明确的、更稳定的版本号 v0.5
        uses: huggingface/hub-action@v0.5 
        with:
          # HF Space 的完整 ID
          repo_id: "xiaoxiao666111/wu-fu-mi"

          # 仓库类型
          repo_type: space

          # 访问令牌
          token: ${{ secrets.HF_TOKEN }}
          
          # 强制推送
          force_push: true
